plugins {
    id 'com.android.application'
}

android {
    namespace 'com.verity.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.verity.game'   // Cámbialo por el tuyo antes de publicar (ver README)
        minSdk 24
        targetSdk 35                       // Google Play exige subirlo cada año
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DVERITY_BUILD_TESTS=OFF',
                          '-DVERITY_DEV_SHOTS=OFF'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Para publicar: firma el paquete (ver README, sección "Publicar en Google Play").
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google AdMob (anuncios)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
