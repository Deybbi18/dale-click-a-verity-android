name: Compilar Verity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas del juego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y correr las pruebas
        run: |
          cmake -S . -B build -DVERITY_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar el SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null || true
      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Verity-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  windows:
    name: Windows (${{ matrix.nombre }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: moderna
            opengl: ''
          - nombre: PC-vieja-OpenGL2
            opengl: '-DOPENGL_VERSION=2.1'
          - nombre: PC-muy-vieja-OpenGL1
            opengl: '-DOPENGL_VERSION=1.1'
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          cmake -S . -B build -A x64 -DVERITY_BUILD_TESTS=OFF ${{ matrix.opengl }}
          cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Verity-Windows-${{ matrix.nombre }}
          path: build/Release/verity.exe
